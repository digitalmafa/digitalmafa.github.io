<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites | DigitalMAFA</title>
  <meta name="description" content="Your saved DigitalMAFA services.">
  <link rel="icon" href="images/20261020_102235.png" type="image/png">
  <link href="css/search.css" rel="stylesheet">
  <link href="css/footer.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body{background:#101827;color:#fff}.favorites-page{max-width:1150px;margin:55px auto;padding:24px 20px;min-height:55vh}
    .favorites-page h1{text-align:center;margin:0 0 8px}.favorites-intro{text-align:center;color:#cbd5e1;margin:0 auto 10px}
    .favorites-expiry{text-align:center;color:#94a3b8;font-size:12px;margin:0 auto 28px;max-width:560px}
    .favorites-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .favorite-card{background:#fff;color:#222;border-radius:13px;overflow:hidden;border:1px solid #e5e7eb}
    .favorite-card img{width:100%;height:145px;object-fit:cover;background:#f1ebff}.favorite-card-content{padding:18px}
    .favorite-card h2{font-size:18px;margin:0 0 8px}.favorite-card p{color:#666;font-size:14px;line-height:1.55}
    .favorite-meta{font-size:12px;color:#64748b;margin:12px 0}.favorite-actions{display:flex;gap:8px;margin-top:14px}
    .favorite-actions a,.favorite-actions button{flex:1;text-align:center;padding:10px 8px;border-radius:7px;text-decoration:none;font-weight:650;font-size:13px;cursor:pointer}
    .favorite-view{background:#6c3bff;color:#fff}.favorite-remove{border:1px solid #ef4444;background:#fff;color:#ef4444}
    .favorites-empty{text-align:center;grid-column:1/-1;padding:35px 15px;color:#cbd5e1}.favorites-empty i{font-size:36px;color:#fb7185;display:block;margin-bottom:12px}
    @media(max-width:850px){.favorites-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.favorites-grid{grid-template-columns:1fr}.favorites-page{margin:30px auto}}
  </style>
</head>
<body>
  <!-- Navbar intentionally omitted: add your own navigation here when ready. -->
  <main class="favorites-page">
    <h1><i class="fa-solid fa-heart" style="color:#fb7185"></i> My Favorites</h1>
    <p class="favorites-intro">Your saved services, all in one place.</p>
    <p class="favorites-expiry">Favorites stay saved for 30 days from the day you add them. After 30 days, they are automatically removed.</p>
    <div id="favoritesStatus" class="favorites-expiry" role="status">Loading your favorites...</div>
    <section class="favorites-grid" id="favoritesGrid"></section>
  </main>
  <footer class="digitalmafa-footer"><div class="footer-container"><div class="footer-bottom"><p>&copy; <span id="footer-year"></span> DigitalMAFA. All rights reserved.</p><div><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a></div></div></div></footer>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/favorites-page.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
